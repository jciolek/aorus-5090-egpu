# We don't want to load nvidia modules automatically,
# to ensure that bridge nvidia-egpu-bridge-link-cap is applied first
blacklist nvidia
blacklist nvidia_modeset
blacklist nvidia_uvm
blacklist nvidia_drm

install nvidia /bin/false
install nvidia_modeset /bin/false
install nvidia_uvm /bin/false
install nvidia_drm /bin/false

# nouveau must never bind the eGPU: it races nvidia at boot and would grab the
# GPU before aorus.service applies the bridge cap and loads nvidia. Display is on
# the integrated Intel iGPU, so blacklisting nouveau is safe here.
blacklist nouveau
install nouveau /bin/false
options nouveau modeset=0

# nvidiafb is the legacy NVIDIA framebuffer driver. install.sh's modprobe
# rewriter disables the distro's "blacklist nvidiafb" (it matches any *nvidia*
# line), which lets nvidiafb bind the eGPU at boot and "enable" the device just
# as the TB tunnel comes up. Reassert the blacklist here so it stays disabled.
blacklist nvidiafb
install nvidiafb /bin/false

options nvidia_drm modeset=0 fbdev=0
options nvidia NVreg_DynamicPowerManagement=0x02 NVreg_EnableS0ixPowerManagement=0 NVreg_PreserveVideoMemoryAllocations=0 NVreg_TbEgpuRecoverEnable=1 NVreg_RegistryDwords="RmForceExternalGpu=1"
